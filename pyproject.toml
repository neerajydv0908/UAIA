[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uaia"
version = "0.1.0"
description = "UAIA (U ask, I answer): evidence-checked answers from several language models"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.13.5", "mcp==1.30.0"]

[project.scripts]
answerlab = "answerlab.cli:main"

[tool.setuptools.packages.find]
include = ["answerlab*"]
